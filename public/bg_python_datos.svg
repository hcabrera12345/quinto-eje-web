  <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#9cc9ff" opacity="0.75">
    <text x="40" y="70"><tspan fill="#ffd43b">import</tspan> pandas <tspan fill="#ffd43b">as</tspan> pd</text>
    <text x="40" y="105"><tspan fill="#ffd43b">import</tspan> matplotlib.pyplot <tspan fill="#ffd43b">as</tspan> plt</text>
    <text x="40" y="160">df = pd.read_csv(<tspan fill="#7ee787">"produccion.csv"</tspan>)</text>
    <text x="40" y="195">df.groupby(<tspan fill="#7ee787">"pozo"</tspan>)[<tspan fill="#7ee787">"caudal"</tspan>].mean()</text>
    <text x="40" y="230">df.plot(x=<tspan fill="#7ee787">"fecha"</tspan>, y=<tspan fill="#7ee787">"caudal"</tspan>)</text>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.08">
    <line x1="40" y1="300" x2="760" y2="300"/>
    <line x1="40" y1="380" x2="760" y2="380"/>
